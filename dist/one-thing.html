<!-- Nunito is the whole typographic idea: round, heavy, friendly at 800. It
     ships with the app (see fonts/) rather than coming from Google, so it is
     there on the first offline launch and nobody outside is told you opened
     the app. Preloaded because text can't paint until it arrives. -->


<style>
  html,body{height:100%}
  body{margin:0;background:#fff}
  @media (prefers-color-scheme:dark){body{background:#131f24}}
  [hidden],.hidden{display:none!important}
</style>

/* ═══════════════════════════════════════════════════════════════
   One Thing — styles

   Bright and saturated, in the Duolingo register: strong colour blocks,
   rounded heavy type, and buttons with a solid bottom edge that collapses
   when pressed, so tapping feels like pressing a real key.

   The dark theme keeps the same hues but sits them on a deep blue-slate
   ground rather than black — bright colours on true black vibrate, and this
   app is meant to be opened every day.
   ═══════════════════════════════════════════════════════════════ */

:root{
  --ground:#ffffff;   --ground-2:#f7f7f7;
  --surface:#ffffff;  --sunken:#f7f7f7;   --raised:#ffffff;
  --ink:#3c3c3c;      --ink-2:#777777;    --ink-3:#afafaf;
  --rule:#e5e5e5;     --rule-2:#d4d4d4;

  /* The five workhorses. Each carries a darker edge for button bottoms. */
  --green:#4ead2b;    --green-dk:#3d8c1e;  --green-soft:#dff2cd;
  --blue:#1cb0f6;     --blue-dk:#1899d6;   --blue-soft:#ddf4ff;
  --purple:#ce82ff;   --purple-dk:#a568cc; --purple-soft:#f7ecff;
  --orange:#ff9600;   --orange-dk:#e08600; --orange-soft:#fff0d9;
  --red:#ff4b4b;      --red-dk:#ea2b2b;    --red-soft:#ffdfe0;
  --yellow:#ffc800;   --yellow-dk:#e0af00;

  --accent:var(--green); --accent-dk:var(--green-dk); --on-accent:#ffffff;
  --done:var(--green);

  --sh-1:0 2px 0 var(--rule);
  --sh-2:0 4px 12px rgba(0,0,0,.08);
  --sh-3:0 10px 32px rgba(0,0,0,.16);

  /* Motion — tight. Fast is most of what "feels good" means. */
  --t1:60ms; --t2:110ms; --t3:170ms; --t4:240ms; --t5:340ms;
  --e-out:cubic-bezier(0,0,.38,.9);
  --e-in:cubic-bezier(.3,0,1,.9);
  --e-std:cubic-bezier(.2,0,0,1);
  --e-back:cubic-bezier(.2,1.3,.4,1);
  --e-expo:cubic-bezier(.22,1,.36,1);

  --topic-mix:62%;
  --font:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --topic-mix:88%;
    --ground:#131f24;   --ground-2:#0f191d;
    --surface:#1b2a30;  --sunken:#16232a;  --raised:#20323a;
    --ink:#f1f7fb;      --ink-2:#a9bdc7;   --ink-3:#6f8590;
    --rule:#2e434d;     --rule-2:#3c5561;
    --green-soft:#1e3318; --blue-soft:#123243; --purple-soft:#2f2340;
    --orange-soft:#3a2a10; --red-soft:#3d1d1f;
    --sh-1:0 2px 0 var(--rule);
    --sh-2:0 4px 14px rgba(0,0,0,.4);
    --sh-3:0 12px 36px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --topic-mix:88%;
  --ground:#131f24;   --ground-2:#0f191d;
  --surface:#1b2a30;  --sunken:#16232a;  --raised:#20323a;
  --ink:#f1f7fb;      --ink-2:#a9bdc7;   --ink-3:#6f8590;
  --rule:#2e434d;     --rule-2:#3c5561;
  --green-soft:#1e3318; --blue-soft:#123243; --purple-soft:#2f2340;
  --orange-soft:#3a2a10; --red-soft:#3d1d1f;
  --sh-1:0 2px 0 var(--rule);
  --sh-2:0 4px 14px rgba(0,0,0,.4);
  --sh-3:0 12px 36px rgba(0,0,0,.55);
}
@media (prefers-reduced-motion:reduce){
  :root{--t1:.01ms;--t2:.01ms;--t3:.01ms;--t4:.01ms;--t5:.01ms}
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);
  font-size:16.5px;line-height:1.5;font-weight:600;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;font-family:var(--font)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ═══════════ TYPE ═══════════ */
h1,h2,h3{font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
.day-name{font-weight:900;font-size:1.7rem;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.tiny{font-size:.8rem;color:var(--ink-2);line-height:1.45;font-weight:600}
.small{font-size:.88rem;color:var(--ink-2);font-weight:600}
.label{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}

/* ═══════════ SHELL ═══════════ */
.app{max-width:452px;margin:0 auto;min-height:100dvh;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;background:var(--ground);position:relative}
@media(min-width:453px){.app{border-inline:2px solid var(--rule)}}

.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.logo{font-weight:900;font-size:1.05rem;letter-spacing:-.02em;color:var(--blue)}
.bar{display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:12px;border:2px solid var(--rule);
  background:var(--surface);display:grid;place-items:center;color:var(--ink-2);
  transition:color var(--t2) var(--e-out),border-color var(--t2) var(--e-out),
             transform var(--t1) var(--e-out)}
.iconbtn:active{transform:scale(.92)}
.iconbtn:hover{color:var(--ink);border-color:var(--rule-2)}
.iconbtn svg{width:18px;height:18px}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--rule);
  background:var(--sunken);padding:0;overflow:hidden;display:grid;place-items:center;
  font-weight:900;font-size:.9rem;color:var(--ink-2);
  transition:transform var(--t1) var(--e-out),border-color var(--t2) var(--e-out)}
.avatar:active{transform:scale(.92)}
.avatar:hover{border-color:var(--green)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.signed{border-color:var(--green)}

main{overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;position:relative}
main::-webkit-scrollbar{width:0}

.tabbar{display:flex;border-top:2px solid var(--rule);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:11px 4px 10px;color:var(--ink-3);
  font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  position:relative;white-space:nowrap;transition:color var(--t2) var(--e-out)}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-selected="true"]{color:var(--blue)}

/* ═══════════ RING ═══════════ */
.ringwrap{display:grid;place-items:center;padding:14px 0 8px}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg);overflow:visible;display:block}
.seg{fill:none;stroke-linecap:round;
  transition:stroke-dasharray var(--t4) var(--e-std),stroke-dashoffset var(--t4) var(--e-std),
             stroke var(--t3) var(--e-out)}
.seg.empty{stroke:var(--rule)}
.ringmid{position:absolute;text-align:center;display:grid;gap:2px;place-items:center;
  max-width:150px}
.ringcount{font-size:.8rem;font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.ring.bump{animation:bump var(--t5) var(--e-back)}
@keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.06)}100%{transform:scale(1)}}
.ring.finale{animation:finale 880ms cubic-bezier(.45,0,.2,1) forwards}
@keyframes finale{0%{transform:rotate(0) scale(1);opacity:1}
  55%{transform:rotate(390deg) scale(1.08);opacity:1}
  100%{transform:rotate(720deg) scale(.08);opacity:0}}

/* ═══════════ ROWS ═══════════ */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:14px 13px;position:relative;
  border-radius:16px;background:var(--surface);
  border:2px solid color-mix(in oklab,var(--topic,var(--rule)) 40%,var(--rule));
  border-bottom-width:4px;
  transition:opacity var(--t3) var(--e-in),transform var(--t3) var(--e-in),
             background var(--t2) var(--e-out),border-color var(--t2) var(--e-out)}
/* The topic tints the whole row, not a dot beside it. */
.row{background:color-mix(in oklab,var(--topic,transparent) 9%,var(--surface))}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-size:.97rem;font-weight:700;line-height:1.3;position:relative;
  word-break:break-word}
.row-sub{font-size:.76rem;color:var(--ink-2);font-weight:700}
/* A bright fill is the wrong colour for six-point text. Mixing the topic
   toward the ink keeps the hue recognisable and the words readable, in
   either theme, from one hex per topic. */
.row-sub b{font-weight:800;color:color-mix(in oklab,var(--topic,var(--ink-2)) var(--topic-mix),var(--ink))}

/* The round swatch used where a row can't be tinted — pick lists, stats. */
.dot{width:12px;height:12px;border-radius:50%;flex:none;
  background:var(--topic,var(--rule-2));
  box-shadow:0 0 0 3px color-mix(in oklab,var(--topic,var(--rule-2)) 18%,transparent)}

.row.in{animation:rowIn var(--t4) var(--e-back)}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.row.done{background:var(--sunken);border-color:var(--rule);opacity:.7}
.row.done .row-title{color:var(--ink-2);text-decoration:line-through;
  text-decoration-thickness:2px}
.row.out{opacity:0;transform:translateX(14px)}
.row .strike{position:absolute;left:0;top:52%;height:2px;width:100%;
  background:var(--ink-2);transform-origin:left;animation:strike 150ms var(--e-out) forwards}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.cbx{position:relative;flex:none;width:30px;height:30px;border-radius:10px;padding:0;
  border:2px solid color-mix(in oklab,var(--topic,var(--rule-2)) 60%,var(--rule-2));
  background:var(--surface);display:grid;place-items:center;
  transition:background var(--t2) var(--e-out),border-color var(--t2) var(--e-out),
             transform var(--t1) var(--e-out)}
.cbx::after{content:'';position:absolute;inset:-9px}
.cbx:active{transform:scale(.86)}
.cbx svg{width:17px;height:17px}
.cbx path{fill:none;stroke:#fff;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1}
.cbx.on{background:var(--green);border-color:var(--green-dk)}
.cbx.on path{animation:draw 160ms var(--e-expo) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.mini{flex:none;background:none;border:none;color:var(--ink-3);padding:6px;
  border-radius:9px;line-height:0;transition:color var(--t2) var(--e-out)}
.mini:hover{color:var(--ink)}
.mini svg{width:18px;height:18px}

/* ═══════════ BUTTONS ═══════════
   Solid fill, darker bottom edge, and the edge collapses on press. That one
   detail is most of why these feel like keys rather than rectangles. */
.btn{font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.055em;
  border-radius:16px;border:none;border-bottom:4px solid var(--btn-edge,transparent);
  padding:14px 18px;width:100%;display:flex;align-items:center;justify-content:center;
  gap:8px;background:var(--btn-bg,var(--surface));color:var(--btn-ink,var(--ink));
  transition:transform var(--t1) var(--e-out),filter var(--t2) var(--e-out),
             opacity var(--t2) var(--e-out)}
.btn:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.btn.primary{--btn-bg:var(--green);--btn-edge:var(--green-dk);--btn-ink:#fff}
.btn.blue{--btn-bg:var(--blue);--btn-edge:var(--blue-dk);--btn-ink:#fff}
.btn.danger{--btn-bg:var(--red);--btn-edge:var(--red-dk);--btn-ink:#fff}
.btn.quiet{--btn-bg:var(--surface);--btn-ink:var(--ink-2);
  border:2px solid var(--rule);border-bottom-width:4px}
.btn.quiet:hover{--btn-ink:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:disabled:active{transform:none;border-bottom-width:4px;margin-bottom:0}
.link{background:none;border:none;color:var(--ink-2);font-size:.86rem;font-weight:800;
  padding:10px;width:100%;text-transform:uppercase;letter-spacing:.05em;
  font-family:var(--font)}
.link:hover{color:var(--blue)}

/* ═══════════ EMPTY ═══════════ */
.empty{text-align:center;padding:22px 10px;display:grid;gap:10px;justify-items:center}
.empty h3{font-size:1.28rem}
.fade-up{animation:fadeUp var(--t5) var(--e-out)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═══════════ SHEET ═══════════ */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.5);z-index:90;
  animation:fadeIn var(--t3) var(--e-out)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scrim.out{animation:fadeOut var(--t3) var(--e-in) forwards}
@keyframes fadeOut{to{opacity:0}}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;
  max-width:452px;max-height:93dvh;background:var(--ground);z-index:91;
  border-radius:22px 22px 0 0;box-shadow:var(--sh-3);display:flex;flex-direction:column;
  animation:sheetIn var(--t4) var(--e-std);padding-bottom:env(safe-area-inset-bottom);
  border:2px solid var(--rule);border-bottom:none}
@keyframes sheetIn{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet.out{animation:sheetOut var(--t3) var(--e-in) forwards}
@keyframes sheetOut{to{transform:translate(-50%,100%)}}
.grab{width:38px;height:5px;border-radius:99px;background:var(--rule-2);margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;flex:none}
.sheet-head h2{font-size:1.3rem}
.sheet-body{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:13px}
.sheet-body::-webkit-scrollbar{width:0}

/* ═══════════ FORM ═══════════ */
.field{display:flex;flex-direction:column;gap:7px}
.field > label{font-size:.78rem;font-weight:800;color:var(--ink-2);text-transform:uppercase;
  letter-spacing:.06em}
.input{width:100%;font-family:var(--font);font-size:.98rem;font-weight:700;padding:14px 14px;
  border-radius:14px;background:var(--sunken);border:2px solid var(--rule);color:var(--ink);
  transition:border-color var(--t2) var(--e-out),background var(--t2) var(--e-out)}
.input::placeholder{color:var(--ink-3);font-weight:600}
.input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.pickrow{display:flex;gap:7px;flex-wrap:wrap}
.pick{font-family:var(--font);font-size:.81rem;font-weight:800;padding:9px 14px;
  border-radius:14px;background:var(--surface);color:var(--ink-2);
  border:2px solid var(--rule);border-bottom-width:3px;display:inline-flex;
  align-items:center;gap:7px;
  transition:border-color var(--t2) var(--e-out),color var(--t2) var(--e-out),
             background var(--t2) var(--e-out),transform var(--t1) var(--e-out)}
.pick:active{transform:translateY(2px);border-bottom-width:1px;margin-bottom:2px}
.pick i{width:10px;height:10px;border-radius:50%;flex:none}
/* A chosen topic chip wears its own colour. Picking "Health" and getting a
   blue highlight is a small lie the eye notices. */
.pick[aria-pressed="true"]{
  border-color:var(--topic,var(--blue));
  background:color-mix(in oklab,var(--topic,var(--blue)) 14%,var(--surface));
  color:color-mix(in oklab,var(--topic,var(--blue)) var(--topic-mix),var(--ink))}
.picklabel{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin:14px 0 7px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--rule)}
.switch{width:52px;height:30px;border-radius:99px;background:var(--rule-2);border:none;
  padding:3px;display:flex;transition:background var(--t2) var(--e-out)}
.switch span{width:24px;height:24px;border-radius:50%;background:#fff;display:block;
  box-shadow:0 2px 3px rgba(0,0,0,.25);transition:transform var(--t3) var(--e-back)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"] span{transform:translateX(22px)}

/* ═══════════ SELECTABLE ═══════════ */
.selrow{display:flex;align-items:center;gap:12px;padding:14px 13px;border-radius:16px;
  background:var(--surface);border:2px solid var(--rule);border-bottom-width:4px;
  width:100%;text-align:left;font-family:var(--font);
  transition:border-color var(--t2) var(--e-out),background var(--t2) var(--e-out),
             transform var(--t1) var(--e-out)}
.selrow:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.selrow[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.selbox{width:26px;height:26px;border-radius:9px;border:2px solid var(--rule-2);flex:none;
  display:grid;place-items:center;transition:all var(--t2) var(--e-out)}
.selrow[aria-pressed="true"] .selbox{background:var(--blue);border-color:var(--blue-dk)}
.selbox svg{width:15px;height:15px;opacity:0;stroke:#fff;stroke-width:3.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:opacity var(--t2) var(--e-out)}
.selrow[aria-pressed="true"] .selbox svg{opacity:1}

/* ═══════════ TOPICS ═══════════ */
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:12px;border:3px solid transparent;padding:0;
  transition:transform var(--t1) var(--e-out),border-color var(--t2) var(--e-out)}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.topicrow{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);
  border:2px solid var(--rule);border-bottom-width:4px;border-radius:16px}
.topicrow .name{flex:1;min-width:0;font-size:.95rem;font-weight:800}
.topicrow .count{font-size:.78rem;color:var(--ink-3);font-weight:800}

/* ═══════════ STATS ═══════════ */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:2px solid var(--rule);border-bottom-width:4px;
  border-radius:16px;padding:14px}
.stat b{font-size:1.8rem;font-weight:900;display:block;line-height:1.05;
  letter-spacing:-.02em;color:var(--stat,var(--ink))}
.stat span{font-size:.76rem;color:var(--ink-2);display:block;margin-top:2px;line-height:1.35;
  font-weight:700}
.week{display:flex;gap:6px}
.week span{flex:1;aspect-ratio:1;border-radius:11px;background:var(--sunken);
  border:2px solid var(--rule);display:grid;place-items:center;font-size:.66rem;
  font-weight:800;color:var(--ink-3)}
.week span.hit{background:var(--green);border-color:var(--green-dk);color:#fff}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;display:block}
.barline{display:flex;flex-direction:column;gap:5px}
.barline .t{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800}
.bartrack{height:12px;border-radius:99px;background:var(--sunken);overflow:hidden;
  border:1px solid var(--rule)}
.bartrack i{display:block;height:100%;border-radius:99px}

/* ═══════════ TOAST ═══════════ */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;z-index:95;
  display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--ground);
  padding:12px 12px 12px 16px;border-radius:14px;box-shadow:var(--sh-3);
  font-size:.86rem;font-weight:800;animation:toastIn var(--t4) var(--e-back);
  max-width:min(400px,calc(100% - 32px))}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.out{animation:toastOut var(--t3) var(--e-in) forwards}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,14px)}}
.toast button{background:none;border:none;color:var(--green);font-weight:900;font-size:.86rem;
  text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;font-family:var(--font)}

/* ═══════════ MISC ═══════════ */
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);
  pointer-events:none;z-index:5;animation:fly var(--life,480ms) cubic-bezier(.15,.6,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.groupline{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:20px 0 9px}
.note{font-size:.82rem;color:var(--ink-2);background:var(--blue-soft);border-radius:14px;
  padding:13px 14px;line-height:1.5;border:2px solid color-mix(in oklab,var(--blue) 25%,transparent);
  font-weight:700}
.note b{color:var(--ink);font-weight:800}
.greeting{text-align:center;font-size:.88rem;color:var(--ink-2);font-weight:700;margin:0}
.hidden{display:none!important}
hr.rule{border:none;border-top:2px solid var(--rule);margin:4px 0}

/* ═══════════ AUTH ═══════════ */
.authcard{background:var(--surface);border:2px solid var(--rule);border-bottom-width:4px;
  border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:11px}
.authmsg{font-size:.84rem;font-weight:700;border-radius:12px;padding:11px 12px;line-height:1.45}
.authmsg.err{background:var(--red-soft);color:var(--red-dk);
  border:2px solid color-mix(in oklab,var(--red) 30%,transparent)}
.authmsg.ok{background:var(--green-soft);color:var(--green-dk);
  border:2px solid color-mix(in oklab,var(--green) 30%,transparent)}
:root[data-theme="dark"] .authmsg.err{color:#ff9a9a}
:root[data-theme="dark"] .authmsg.ok{color:#a9ef7f}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .authmsg.err{color:#ff9a9a}
  :root:not([data-theme="light"]) .authmsg.ok{color:#a9ef7f}
}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.syncdot.on{background:var(--green)}
.syncdot.busy{background:var(--yellow);animation:pulse 1s ease-in-out infinite}
.syncdot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.syncline{display:flex;align-items:center;gap:9px;font-size:.8rem;font-weight:700;
  color:var(--ink-2)}

</style>
</head>
<body>

<div class="app">
  <header class="appbar">
    <div class="logo">One&nbsp;Thing</div>

<!-- config first (sync reads it), then sync (app checks for it), then app. -->
<script>
/* ═══════════════════════════════════════════════════════════════
   One Thing — backend configuration

   Leave this exactly as it is and the app runs the way it always has:
   everything on the device, no account, no network, works on a plane.

   Fill in the two values below and the app grows accounts and sync —
   anyone you send the link to can make their own account, and their
   tasks follow them to any device they sign in on.

   Where the values come from:
     Supabase dashboard → your project → Settings → API
       Project URL   →  SUPABASE_URL
       anon / public →  SUPABASE_ANON_KEY

   The anon key is *meant* to be public. It sits in every visitor's
   browser and it can only do what your row-level-security policies
   allow — which, per supabase/schema.sql, is "read and write your own
   row and nobody else's".

   The service_role key is the opposite. It bypasses every policy.
   It must never appear in this file or anywhere else in this repo.
   ═══════════════════════════════════════════════════════════════ */
window.OT_CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: ''
};

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   One Thing — accounts and sync

   Everything here is optional. With no config.js values the whole file
   does nothing but report "off", and the app is exactly the local-only
   app it was before. That is deliberate: the offline path must never
   depend on the online one.

   The shape of it:

     · The whole state is one JSON document, one row per person.
     · Saving locally is instant and unconditional. The network is a
       background chore, never something you wait for.
     · Sync is pull → merge → push, serialised so two of them can't
       overlap.

   The merge is the part worth reading. Last-write-wins on the whole
   document is easy and loses things — finish a task on your phone while
   your laptop has a stale copy open, and the laptop's next save erases
   it. So the pieces that must never be lost are merged as sets instead:

     history  union by hid, minus the union of the undo tombstones
     library  union by id,  minus the union of the delete tombstones
     topics   same
     day.done union, when both devices are on the same day

   Everything else — your name, avatar, theme, day-start hour — is
   genuinely last-write-wins, because for those it's the right answer.
   ═══════════════════════════════════════════════════════════════ */
window.OTSync = (function () {
  'use strict';

  var cfg = window.OT_CONFIG || {};
  var url = (cfg.SUPABASE_URL || '').trim().replace(/\/+$/, '');
  var key = (cfg.SUPABASE_ANON_KEY || '').trim();
  var configured = !!(url && key && url.indexOf('http') === 0);

  var sb = null;            // the supabase client, once loaded
  var user = null;
  var status = configured ? 'signedout' : 'off';
  var lastError = '';
  var host = {};            // { get, set } handed over by app.js
  var listeners = [];
  var chain = Promise.resolve();
  var pushTimer = null;
  var poll = null;

  var TABLE = 'app_state';

  function emit() { listeners.forEach(function (f) { try { f(api); } catch (e) {} }); }
  function setStatus(s, err) {
    status = s; lastError = err || '';
    emit();
  }

  /* ── The library, fetched only if it is actually going to be used ──
     An offline-first app has no business blocking its first paint on a
     CDN. Nothing here runs until the app is configured, and even then
     it runs after boot. */
  var sdk = null;
  function loadSdk() {
    if (sdk) return sdk;
    sdk = new Promise(function (resolve, reject) {
      if (window.supabase && window.supabase.createClient) return resolve(window.supabase);
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
      s.async = true;
      s.onload = function () {
        if (window.supabase && window.supabase.createClient) resolve(window.supabase);
        else reject(new Error('Sync library loaded but looked wrong.'));
      };
      s.onerror = function () { reject(new Error('Could not reach the sync service.')); };
      document.head.appendChild(s);
    });
    return sdk;
  }

  function client() {
    if (sb) return Promise.resolve(sb);
    return loadSdk().then(function (lib) {
      sb = lib.createClient(url, key, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      sb.auth.onAuthStateChange(function (_evt, session) {
        var next = session && session.user ? session.user : null;
        var changed = (next && next.id) !== (user && user.id);
        user = next;
        if (changed) {
          if (user) { setStatus('busy'); startPolling(); sync(); }
          else { setStatus('signedout'); stopPolling(); }
        }
      });
      return sb;
    });
  }

  /* ── Merge ───────────────────────────────────────────────────── */
  function uniq(a, b, keyOf) {
    var seen = {}, out = [];
    (a || []).concat(b || []).forEach(function (x) {
      if (!x) return;
      var k = keyOf(x);
      if (k === undefined || k === null || seen[k]) return;
      seen[k] = 1; out.push(x);
    });
    return out;
  }
  function idset(a, b) {
    var m = {};
    (a || []).concat(b || []).forEach(function (x) { m[x] = 1; });
    return m;
  }

  function merge(local, remote) {
    if (!remote) return local;
    if (!local) return remote;

    // The newer document wins the scalars. Everything set-like below is
    // then merged back over the top of it.
    var base = (remote.rev || 0) > (local.rev || 0) ? remote : local;
    var out = JSON.parse(JSON.stringify(base));

    var undone = idset(local.removed, remote.removed);
    var libGone = idset(local.libDel, remote.libDel);
    var topGone = idset(local.topDel, remote.topDel);

    out.removed = Object.keys(undone);
    out.libDel = Object.keys(libGone).map(Number);
    out.topDel = Object.keys(topGone);

    // Completions: a set that only ever grows, minus the undos. The one
    // thing in here that would genuinely hurt to lose.
    out.history = uniq(local.history, remote.history, function (h) { return h.hid; })
      .filter(function (h) { return !undone[h.hid]; })
      .sort(function (x, y) { return (x.at || 0) - (y.at || 0); });

    // A task added on one device and a task added on the other both survive.
    // The newer document's copy of a shared id wins, which is why base goes
    // first into uniq().
    var baseIsRemote = base === remote;
    out.library = uniq(baseIsRemote ? remote.library : local.library,
                       baseIsRemote ? local.library : remote.library,
                       function (t) { return t.id; })
      .filter(function (t) { return !libGone[t.id]; });
    out.topics = uniq(baseIsRemote ? remote.topics : local.topics,
                      baseIsRemote ? local.topics : remote.topics,
                      function (t) { return t.id; })
      .filter(function (t) { return !topGone[t.id]; });
    if (!out.topics.length) out.topics = base.topics || local.topics || remote.topics;

    // Today. Only worth merging when both devices agree what today is —
    // otherwise the newer one simply has the right answer.
    var ld = local.day, rd = remote.day;
    if (ld && rd && ld.key === rd.key) {
      var done = idset(ld.done, rd.done);
      out.day = {
        key: ld.key,
        tasks: uniq(ld.tasks, rd.tasks, function (x) { return x; }),
        done: Object.keys(done).map(Number),
        planned: !!(ld.planned || rd.planned),
        cap: (base.day && base.day.cap) || ld.cap || rd.cap || null
      };
      // Nothing can be marked done that isn't on the day.
      out.day.done = out.day.done.filter(function (x) { return out.day.tasks.indexOf(x) >= 0; });
    }

    out.rev = Math.max(local.rev || 0, remote.rev || 0);
    return out;
  }

  /* ── Transfer ────────────────────────────────────────────────── */
  function pull() {
    return client().then(function (c) {
      return c.from(TABLE).select('doc').eq('user_id', user.id).maybeSingle();
    }).then(function (r) {
      if (r.error) throw r.error;
      return r.data ? r.data.doc : null;
    });
  }

  function push(doc) {
    return client().then(function (c) {
      return c.from(TABLE).upsert({
        user_id: user.id,
        doc: doc,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    }).then(function (r) {
      if (r.error) throw r.error;
    });
  }

  /* One at a time. Two overlapping syncs would each push a document that
     didn't see the other's merge. */
  function sync() {
    if (!user) return Promise.resolve();
    chain = chain.then(function () {
      if (!user) return;
      setStatus('busy');
      return pull().then(function (remote) {
        var local = host.get();
        var merged = merge(local, remote);
        if (remote) host.set(merged);
        return push(merged);
      }).then(function () {
        setStatus('on');
      }).catch(function (e) {
        setStatus('err', friendly(e));
      });
    });
    return chain;
  }

  function friendly(e) {
    var m = (e && (e.message || e.error_description || e.msg)) || String(e || 'Something went wrong.');
    if (/Failed to fetch|NetworkError|reach the sync/i.test(m))
      return 'No connection. Your tasks are saved here and will sync when you are back online.';
    if (/Invalid login credentials/i.test(m)) return 'That email and password do not match.';
    if (/User already registered/i.test(m)) return 'There is already an account with that email. Sign in instead.';
    if (/Password should be at least/i.test(m)) return 'Use at least 6 characters for the password.';
    if (/Email not confirmed/i.test(m)) return 'Check your email and confirm the address first.';
    if (/relation .*app_state.* does not exist/i.test(m))
      return 'The database table is missing — run supabase/schema.sql in the SQL editor.';
    return m;
  }

  function startPolling() {
    stopPolling();
    // Cheap, predictable, and it survives a sleeping phone in a way a
    // websocket does not. A single row is a very small read.
    poll = setInterval(function () { if (user && navigator.onLine) sync(); }, 45000);
  }
  function stopPolling() { if (poll) clearInterval(poll); poll = null; }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && user && navigator.onLine) sync();
  });
  window.addEventListener('online', function () { if (user) sync(); });

  /* ── What app.js talks to ────────────────────────────────────── */
  var api = {
    get configured() { return configured; },
    get status() { return status; },          // off | signedout | busy | on | err
    get error() { return lastError; },
    get email() { return user ? user.email : ''; },
    get signedIn() { return !!user; },

    init: function (h) {
      host = h;
      if (!configured) return;
      // Restore a session if there is one. Boot has already painted by now.
      client().then(function (c) { return c.auth.getSession(); })
        .then(function (r) {
          var s = r && r.data && r.data.session;
          if (s && s.user) { user = s.user; setStatus('busy'); startPolling(); sync(); }
          else setStatus('signedout');
        })
        .catch(function (e) { setStatus('err', friendly(e)); });
    },

    onChange: function (f) { listeners.push(f); },

    /* Called on every local save. Coalesced, because typing a task name
       fires one of these per keystroke. */
    touch: function () {
      if (!user) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function () { sync(); }, 1200);
    },

    syncNow: function () { return sync(); },

    signUp: function (email, password) {
      return client()
        .then(function (c) { return c.auth.signUp({ email: email, password: password }); })
        .then(function (r) {
          if (r.error) throw r.error;
          // With email confirmation on, there is no session yet.
          return { needsConfirm: !(r.data && r.data.session) };
        });
    },

    signIn: function (email, password) {
      return client()
        .then(function (c) { return c.auth.signInWithPassword({ email: email, password: password }); })
        .then(function (r) { if (r.error) throw r.error; return {}; });
    },

    resetPassword: function (email) {
      return client()
        .then(function (c) {
          return c.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
        })
        .then(function (r) { if (r.error) throw r.error; return {}; });
    },

    signOut: function () {
      // Push whatever is outstanding before letting go of the session,
      // so signing out is never how someone loses an afternoon.
      return sync().then(function () { return client(); })
        .then(function (c) { return c.auth.signOut(); })
        .then(function () { user = null; stopPolling(); setStatus('signedout'); });
    },

    friendly: friendly,
    merge: merge   // exported for the test page
  };

  return api;
})();

</script>
<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var KEY = 'onething.v3';

  /* ── Topic colours ──────────────────────────────────────
     Ten saturated hues. Deliberately the *same* colour in both themes — that
     is what keeps a bright palette feeling like one app rather than two. The
     dark value is nudged up a little only where the hue loses punch against a
     dark ground. These are fills: borders, tints, dots, bars. Where a topic
     colour has to carry small text, the stylesheet mixes it toward the ink. */
  var SWATCHES = [
    { id: 'green',  l: '#4ead2b', d: '#5cc134' },
    { id: 'blue',   l: '#1cb0f6', d: '#31bcff' },
    { id: 'purple', l: '#ce82ff', d: '#d493ff' },
    { id: 'orange', l: '#ff9600', d: '#ffa424' },
    { id: 'red',    l: '#ff4b4b', d: '#ff6262' },
    { id: 'yellow', l: '#ffc800', d: '#ffd21f' },
    { id: 'pink',   l: '#ff86d0', d: '#ff97d7' },
    { id: 'teal',   l: '#00cdb3', d: '#0ee0c6' },
    { id: 'indigo', l: '#6b7bf7', d: '#8290ff' },
    { id: 'slate',  l: '#7c93a0', d: '#94aab6' }
  ];
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  }
  var RETIRED = { clay: 'orange', amber: 'yellow', olive: 'green', forest: 'green',
                  plum: 'purple', rose: 'red', sand: 'orange', stone: 'slate' };
  function swatchColor(id) {
    id = RETIRED[id] || id;
    var s = SWATCHES.filter(function (x) { return x.id === id; })[0] || SWATCHES[9];
    return isDark() ? s.d : s.l;
  }

  /* ── Time ─────────────────────────────────────────────── */
  function localDay(at, startHour) {
    var d = new Date(at.getTime());
    if (d.getHours() < startHour) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }
  function parseDay(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayName(k) {
    return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][parseDay(k).getDay()];
  }
  function shiftDay(k, n) {
    var d = parseDay(k); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  /* ── State ────────────────────────────────────────────── */
  function fresh() {
    return {
      name: '', avatar: '', dayStart: 4, theme: '', uid: 200,
      topics: [
        { id: 't1', n: 'Personal',    sw: 'purple' },
        { id: 't2', n: 'Health',      sw: 'green'  },
        { id: 't3', n: 'Home',        sw: 'orange' },
        { id: 't4', n: 'Work/School', sw: 'blue'   }
      ],
      library: [
        { id: 1, t: 'Morning meds',   top: 't2', rep: { k: 'daily' } },
        { id: 2, t: 'Walk the dog',   top: 't2', rep: { k: 'daily' } },
        { id: 3, t: 'Bins out',       top: 't3', rep: { k: 'week', d: [2] } },
        { id: 4, t: 'Pay the rent',   top: 't1', rep: { k: 'month', d: 1 } },
        { id: 5, t: 'Tidy the kitchen', top: 't3', rep: { k: 'none' } },
        { id: 6, t: 'Clear the inbox',  top: 't4', rep: { k: 'none' } },
        { id: 7, t: 'Call Mum',         top: 't1', rep: { k: 'none' } },
        { id: 8, t: 'Book the dentist', top: 't2', rep: { k: 'none' } }
      ],
      day: null, history: [], removed: [], libDel: [], topDel: []
    };
  }
  function nid() { return Math.floor(Math.random() * 8999999999999) + 1000000000000; }

  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }
  if (!S || !S.topics || !S.library) S = fresh();
  if (!S.removed) S.removed = [];
  if (!S.libDel) S.libDel = [];
  if (!S.topDel) S.topDel = [];
  if (!S.history) S.history = [];
  function save() {
    S.rev = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    if (window.OTSync) OTSync.touch();
  }
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);

  /* ── Repeat rules ──────────────────────────────────────
     none  · once, sits in the library until you pick it
     daily · every day
     week  · chosen weekdays, e.g. Tuesday and Friday
     month · a date each month, clamped to the last day in short months */
  var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function repLabel(r) {
    if (!r || r.k === 'none') return '';
    if (r.k === 'daily') return 'Every day';
    if (r.k === 'week') {
      var d = (r.d || []).slice().sort(function (a, b) { return a - b; });
      if (!d.length) return 'Weekly';
      if (d.length === 7) return 'Every day';
      if (d.length === 5 && d.join() === '1,2,3,4,5') return 'Weekdays';
      if (d.length === 2 && d.join() === '0,6') return 'Weekends';
      return d.map(function (i) { return WD[i]; }).join(', ');
    }
    if (r.k === 'month') return ordinal(r.d) + ' of the month';
    return '';
  }
  function ordinal(n) {
    var s2 = ['th','st','nd','rd'], v = n % 100;
    return n + (s2[(v - 20) % 10] || s2[v] || s2[0]);
  }
  function dueOn(t, key) {
    var r = t.rep;
    if (!r || r.k === 'none') return false;
    if (r.k === 'daily') return true;
    var d = parseDay(key);
    if (r.k === 'week') return (r.d || []).indexOf(d.getDay()) > -1;
    if (r.k === 'month') {
      var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return d.getDate() === Math.min(r.d, last);
    }
    return false;
  }
  function repeats(t) { return t.rep && t.rep.k !== 'none'; }

  function topic(id) { return S.topics.filter(function (t) { return t.id === id; })[0] || S.topics[0]; }
  function topColor(id) { return swatchColor(topic(id).sw); }
  function todayKey() { return localDay(new Date(), S.dayStart); }

  function ensureDay() {
    var k = todayKey();
    if (!S.day || S.day.key !== k) {
      S.day = { key: k, planned: false, tasks: [], done: [] };
      // Anything whose rule lands on this date is already in the day.
      S.library.filter(function (t) { return dueOn(t, k); })
        .forEach(function (t) { S.day.tasks.push(t.id); });
      save();
    }
  }
  ensureDay();
  function lib(id) { return S.library.filter(function (t) { return t.id === id; })[0]; }
  function openIds() {
    return S.day.tasks.filter(function (id) { return S.day.done.indexOf(id) < 0 && lib(id); });
  }
  function dayTotal() { return S.day.tasks.filter(function (id) { return lib(id); }).length; }

  /* ── Helpers ──────────────────────────────────────────── */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function tick(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch (e) {} }
  function el(h) { var d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; }
  var main = document.getElementById('main');
  var tab = 'today';

  var toastEl = null, toastT = null;
  function toast(msg, undo) {
    if (toastEl) { toastEl.remove(); clearTimeout(toastT); }
    toastEl = el('<div class="toast"><span>' + esc(msg) + '</span>' +
      (undo ? '<button type="button">Undo</button>' : '') + '</div>');
    if (undo) toastEl.querySelector('button').addEventListener('click', function () { undo(); hideToast(); });
    document.body.appendChild(toastEl);
    toastT = setTimeout(hideToast, 4500);
  }
  function hideToast() {
    if (!toastEl) return;
    var t = toastEl; toastEl = null; t.classList.add('out');
    setTimeout(function () { t.remove(); }, 210);
  }

  /* `colours` holds one hex per finished segment. The ring ends the day as a
     picture of what the day was made of, rather than a uniform green bar. */
  function ringSvg(total, colours, px) {
    var R = px / 2 - 11, C = 2 * Math.PI * R, n = Math.max(total, 1);
    var gap = n === 1 ? 0 : Math.min(13, C * 0.034);
    var seg = Math.max((C - gap * n) / n, 2);
    var out = '<svg width="' + px + '" height="' + px + '" viewBox="0 0 ' + px + ' ' + px +
      '" aria-hidden="true">';
    for (var i = 0; i < n; i++) {
      var c = colours[i];
      out += '<circle class="seg' + (c ? '' : ' empty') + '" cx="' + px / 2 + '" cy="' + px / 2 +
        '" r="' + R + '" stroke-width="8"' + (c ? ' stroke="' + c + '"' : '') +
        ' stroke-dasharray="' + seg.toFixed(2) + ' ' + (C - seg).toFixed(2) +
        '" stroke-dashoffset="' + (-(i * (seg + gap))).toFixed(2) + '"/>';
    }
    return out + '</svg>';
  }
  /* Finished tasks first, in the order they were finished. */
  function doneColours() {
    return S.day.done.filter(function (id) { return lib(id); })
      .map(function (id) { return topColor(lib(id).top); });
  }

  function sparks(anchor, host) {
    if (reduce || !host) return;
    var a = anchor.getBoundingClientRect(), h = host.getBoundingClientRect();
    var cx = a.left - h.left + a.width / 2 + host.scrollLeft;
    var cy = a.top - h.top + a.height / 2 + host.scrollTop;
    for (var i = 0; i < 6; i++) {
      var s = document.createElement('span'); s.className = 'spark';
      var ang = (-145 + Math.random() * 110) * Math.PI / 180, d = 20 + Math.random() * 22;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--dx', (Math.cos(ang) * d).toFixed(1) + 'px');
      s.style.setProperty('--dy', (Math.sin(ang) * d).toFixed(1) + 'px');
      s.style.setProperty('--life', (400 + Math.random() * 180).toFixed(0) + 'ms');
      host.appendChild(s);
      (function (n2) { setTimeout(function () { n2.remove(); }, 700); })(s);
    }
  }

  /* A line that changes with what actually happened. Descriptive, never praise
     — "you did four things" is a fact; "great job!" is an opinion someone who
     feels behind will simply disagree with. */
  function greeting() {
    var k = todayKey(), y = shiftDay(k, -1);
    var yc = S.history.filter(function (h) { return h.day === y; }).length;
    var last = S.history.length ? S.history[S.history.length - 1].day : null;
    if (last && last !== k && last !== y) {
      var gap = Math.round((parseDay(k) - parseDay(last)) / 864e5);
      if (gap > 3) return 'Good to see you back. Nothing was lost.';
    }
    if (yc >= 4) return 'You finished ' + yc + ' things yesterday.';
    if (yc > 0) return 'Yesterday: ' + yc + (yc === 1 ? ' thing' : ' things') + ' done.';
    var h = new Date().getHours();
    if (h < 11) return 'A fresh one.';
    if (h < 17) return 'Still plenty of day left.';
    return 'Whatever fits in the evening.';
  }

  function rowHtml(t, done) {
    var tp = topic(t.top), r = repLabel(t.rep);
    return '<li class="row' + (done ? ' done' : '') + '" data-id="' + t.id +
      '" style="--topic:' + topColor(t.top) + '">' +
      '<button class="cbx' + (done ? ' on' : '') + '" type="button" aria-label="' +
        (done ? 'Put back ' : 'Finish ') + esc(t.t) + '">' +
        '<svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.6 4.6L19 7"/></svg></button>' +
      '<span class="row-body"><span class="row-title">' + esc(t.t) + '</span>' +
      '<span class="row-sub"><b>' + esc(tp.n) + '</b>' + (r ? ' · ' + esc(r) : '') +
      '</span></span></li>';
  }

  /* ═══════════════════════════════════════════════════════
     TODAY
     ═══════════════════════════════════════════════════════ */
  function renderToday() {
    ensureDay();
    var open = openIds(), total = dayTotal(), done = total - open.length;
    var clear = total > 0 && open.length === 0;
    var doneList = S.day.done.filter(function (id) { return lib(id); });

    main.innerHTML =
      (clear ? '' :
        '<div class="ringwrap"><div class="ring" id="ring">' +
          ringSvg(total, doneColours(), 196) +
          '<div class="ringmid"><span class="day-name">' + dayName(S.day.key) + '</span>' +
          '<span class="ringcount">' + (total ? done + ' of ' + total : 'nothing yet') +
          '</span></div></div></div>' +
        '<p class="greeting">' + esc(greeting()) + '</p>') +
      '<div id="body" style="margin-top:16px"></div>';

    var body = document.getElementById('body');

    /* Finished tasks stay on the page, checked and struck, in their own group
       underneath. Tapping one puts it back. */
    var doneBlock = doneList.length
      ? '<div class="groupline"><span class="label">Done</span>' +
        '<span class="tiny">' + doneList.length + '</span></div>' +
        '<ul class="list" id="doneList">' +
        doneList.map(function (id) { return rowHtml(lib(id), true); }).join('') + '</ul>' +
        '<p class="tiny" style="margin-top:7px">Tap one to put it back.</p>'
      : '';

    if (clear) {
      body.innerHTML =
        '<div class="empty fade-up" style="padding-top:30px">' +
          '<span class="day-name" style="font-size:1.3rem;color:var(--ink-3)">' +
            dayName(S.day.key) + '</span>' +
          '<h3 style="font-size:1.5rem">That\u2019s the day.</h3>' +
          '<p class="small">' + total + (total === 1 ? ' thing' : ' things') + ' finished.</p>' +
          '<button class="btn primary" id="add" type="button" style="margin-top:8px;max-width:250px">' +
            'Add something else</button></div>' + doneBlock;
    } else {
      body.innerHTML =
        (open.length
          ? '<ul class="list" id="openList">' +
            open.map(function (id) { return rowHtml(lib(id)); }).join('') + '</ul>'
          : '<div class="empty"><h3>Nothing left on today</h3>' +
            '<p class="small">Pick a few things from your list.</p></div>') +
        '<button class="btn quiet" id="add" type="button" style="margin-top:14px">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>' +
          (open.length ? 'Add more to today' : 'Choose today\u2019s tasks') + '</button>' +
        doneBlock;
      body.querySelectorAll('#openList .row').forEach(function (row) {
        row.querySelector('.cbx').addEventListener('click', function (e) {
          finish(row, Number(row.dataset.id), e.currentTarget); });
      });
    }

    body.querySelectorAll('#doneList .row').forEach(function (row) {
      row.querySelector('.cbx').addEventListener('click', function () {
        undoTask(Number(row.dataset.id)); tick(8); });
    });
    var addBtn = body.querySelector('#add');
    if (addBtn) addBtn.addEventListener('click', openPicker);
  }

  function finish(row, id, cbx) {
    if (row.dataset.busy) return;
    row.dataset.busy = '1';
    var t = lib(id);
    cbx.classList.add('on');
    tick(12);
    sparks(cbx, main);
    var title = row.querySelector('.row-title');
    if (title && !title.querySelector('.strike')) {
      var st = document.createElement('span'); st.className = 'strike'; title.appendChild(st);
    }
    row.classList.add('done');

    S.day.done.push(id);
    S.history.push({ hid: 'h' + Date.now() + Math.random().toString(36).slice(2, 5),
                     taskId: id, t: t.t, top: t.top, day: S.day.key, at: Date.now() });
    save();

    var total = dayTotal(), left = openIds().length;
    paintRing(total);
    toast('Finished “' + t.t + '”', function () { undoTask(id); });

    // The row slides out of the open list and comes back, checked, under Done.
    // It is never simply gone.
    setTimeout(function () {
      row.classList.add('out');
      setTimeout(function () {
        if (left === 0 && total > 0) finale(); else renderToday();
      }, reduce ? 0 : 165);
    }, reduce ? 0 : 185);
  }

  function undoTask(id) {
    S.day.done = S.day.done.filter(function (x) { return x !== id; });
    for (var i = S.history.length - 1; i >= 0; i--) {
      if (S.history[i].taskId === id && S.history[i].day === S.day.key) {
        S.removed.push(S.history[i].hid);
        S.history.splice(i, 1);
        break;
      }
    }
    save();
    if (tab === 'today') renderToday();
  }

  function paintRing(total) {
    var ring = document.getElementById('ring');
    if (!ring) return;
    var cols = doneColours();
    ring.innerHTML = ringSvg(total, cols, 196) +
      '<div class="ringmid"><span class="day-name">' + dayName(S.day.key) +
      '</span><span class="ringcount">' + cols.length + ' of ' + total + '</span></div>';
    if (!reduce) { ring.classList.remove('bump'); void ring.offsetWidth; ring.classList.add('bump'); }
  }

  /* The only long animation in the app, and it happens at most once a day. */
  function finale() {
    var ring = document.getElementById('ring');
    var body = document.getElementById('body');
    if (body) body.innerHTML = '';
    var g = document.querySelector('.greeting'); if (g) g.remove();
    tick(18);
    if (ring && !reduce) {
      ring.classList.add('finale');
      setTimeout(renderToday, 820);
    } else { renderToday(); }
  }

  /* ═══════════════════════════════════════════════════════
     TASKS
     ═══════════════════════════════════════════════════════ */
  var filterTop = 'all';
  function renderTasks() {
    var items = S.library.filter(function (t) { return filterTop === 'all' || t.top === filterTop; });
    var daily = items.filter(repeats);
    var rest = items.filter(function (t) { return !repeats(t); });
    var newTop = S.topics[0].id;

    main.innerHTML =
      '<div style="padding-top:6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">' +
        '<div><h2 style="font-size:1.5rem">Your tasks</h2>' +
        '<p class="tiny" style="margin-top:3px">Everything you might do. Nothing here is a promise.</p></div>' +
        '<button class="iconbtn" id="topicsBtn" type="button" aria-label="Manage topics" ' +
          'style="flex:none;margin-top:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.9" stroke-linecap="round"><circle cx="8" cy="8" r="3.4"/>' +
          '<circle cx="16.5" cy="16.5" r="3.4"/><path d="M8 14.5v5M5.5 17h5"/></svg></button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
        '<input class="input" id="newTask" placeholder="Add a task…" maxlength="70" ' +
          'autocomplete="off" enterkeyhint="done">' +
        '<button class="btn primary" id="newGo" type="button" style="width:48px;flex:none;padding:0" ' +
          'aria-label="Add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
          '<path d="M12 5.5v13M5.5 12h13"/></svg></button></div>' +
      '<span class="picklabel">File the new one under</span>' +
      '<div class="pickrow" id="newTop">' +
        S.topics.map(function (t, i) {
          return '<button class="pick" type="button" data-t="' + t.id + '" aria-pressed="' + (i === 0) +
            '" style="--topic:' + topColor(t.id) + '"><i style="background:' + topColor(t.id) +
            '"></i>' + esc(t.n) + '</button>'; }).join('') +
      '</div>' +
      '<hr class="rule" style="margin:20px 0 0">' +
      '<span class="picklabel">Show me</span>' +
      '<div class="pickrow" id="filters">' +
        '<button class="pick" type="button" data-f="all" aria-pressed="' + (filterTop === 'all') +
          '">Everything</button>' +
        S.topics.map(function (t) {
          return '<button class="pick" type="button" data-f="' + t.id + '" aria-pressed="' +
            (filterTop === t.id) + '" style="--topic:' + topColor(t.id) + '"><i style="background:' +
            topColor(t.id) + '"></i>' + esc(t.n) + '</button>'; }).join('') +
      '</div>' +
      (daily.length ? '<div class="groupline"><span class="label">Repeating</span>' +
        '<span class="tiny">' + daily.length + '</span></div><ul class="list">' +
        daily.map(libRow).join('') + '</ul>' : '') +
      (rest.length ? '<div class="groupline"><span class="label">Pick from</span>' +
        '<span class="tiny">' + rest.length + '</span></div><ul class="list">' +
        rest.map(libRow).join('') + '</ul>' : '') +
      (!items.length ? '<div class="empty"><h3>Nothing here yet</h3>' +
        '<p class="small">Add a task above and it will be waiting tomorrow morning.</p></div>' : '') +
      '<p class="note" style="margin-top:18px">Tap any task to set when it repeats — ' +
      '<b>every day</b>, <b>certain days</b> (just Tuesdays, say), or <b>once a month</b>. ' +
      'Repeating tasks are already in your circle when the day comes round.</p>';

    var input = document.getElementById('newTask');
    document.querySelectorAll('#newTop .pick').forEach(function (b) {
      b.addEventListener('click', function () {
        newTop = b.dataset.t;
        document.querySelectorAll('#newTop .pick').forEach(function (x) {
          x.setAttribute('aria-pressed', String(x.dataset.t === newTop)); });
      });
    });
    function add() {
      var v = input.value.trim(); if (!v) return;
      var nt = { id: nid(), t: v, top: newTop, rep: { k: 'none' } };
      S.library.unshift(nt);
      save(); input.value = ''; renderTasks(); tick();
      // Offer the repeat choice right after adding rather than burying it.
      openTask(nt.id, true);
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    document.getElementById('newGo').addEventListener('click', add);
    document.getElementById('topicsBtn').addEventListener('click', openTopics);
    document.querySelectorAll('#filters .pick').forEach(function (b) {
      b.addEventListener('click', function () { filterTop = b.dataset.f; renderTasks(); }); });

    main.querySelectorAll('.row[data-id]').forEach(function (row) {
      var id = Number(row.dataset.id);
      row.querySelector('[data-act="edit"]').addEventListener('click', function () {
        openTask(id, false);
      });
      row.querySelector('[data-act="del"]').addEventListener('click', function () {
        var t = lib(id), ix = S.library.indexOf(t);
        S.library.splice(ix, 1);
        S.libDel.push(id);
        S.day.tasks = S.day.tasks.filter(function (x) { return x !== id; });
        save(); renderTasks();
        toast('Deleted “' + t.t + '”', function () {
          S.library.splice(ix, 0, t);
          S.libDel = S.libDel.filter(function (x) { return x !== id; });
          save(); renderTasks(); });
      });
    });
  }

  function libRow(t) {
    var r = repLabel(t.rep);
    return '<li class="row" data-id="' + t.id + '" style="--topic:' + topColor(t.top) + '">' +
      '<button class="row-body" data-act="edit" type="button" style="background:none;border:none;' +
        'text-align:left;padding:0;font-family:var(--sans);align-items:flex-start">' +
        '<span class="row-title">' + esc(t.t) + '</span>' +
        '<span class="row-sub"><b>' + esc(topic(t.top).n) + '</b>' +
        (r ? ' · ' + esc(r) : '') + '</span></button>' +
      (r ? '<span class="mini" style="color:var(--topic);pointer-events:none" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
        'stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0113.5-3.5L20 8"/>' +
        '<path d="M20 15a8 8 0 01-13.5 3.5L4 16"/><path d="M20 4.5V8h-3.5M4 19.5V16h3.5"/>' +
        '</svg></span>' : '') +
      '<button class="mini" data-act="del" type="button" aria-label="Delete ' + esc(t.t) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
        'stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></li>';
  }

  /* ═══════════════════════════════════════════════════════
     SHEETS
     ═══════════════════════════════════════════════════════ */
  function sheet(title, html, ready) {
    var scrim = el('<div class="scrim"></div>');
    var sh = el('<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' +
      '<div class="sheet-head"><h2>' + title + '</h2>' +
      '<button class="iconbtn" data-close type="button" aria-label="Close">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>' +
      '<div class="sheet-body">' + html + '</div></div>');
    document.body.appendChild(scrim); document.body.appendChild(sh);
    function close() {
      sh.classList.add('out'); scrim.classList.add('out');
      setTimeout(function () { sh.remove(); scrim.remove(); }, 230);
    }
    scrim.addEventListener('click', close);
    sh.querySelector('[data-close]').addEventListener('click', close);
    document.addEventListener('keydown', function k(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
    if (ready) ready(sh, close);
    return close;
  }

  /* ── Topics ──────────────────────────────────────────── */
  function openTopics() {
    function body() {
      return S.topics.map(function (t) {
        var n = S.library.filter(function (x) { return x.top === t.id; }).length;
        return '<div class="topicrow" data-t="' + t.id + '">' +
          '<button class="sw" data-edit="' + t.id + '" style="background:' + topColor(t.id) +
            '" aria-label="Change colour for ' + esc(t.n) + '"></button>' +
          '<span class="name">' + esc(t.n) + '</span>' +
          '<span class="count">' + n + '</span>' +
          (S.topics.length > 1 ? '<button class="mini" data-del="' + t.id +
            '" type="button" aria-label="Delete topic"><svg viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
            '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>' : '') +
          '</div>' +
          '<div class="swatches hidden" data-pal="' + t.id + '" style="padding:2px 2px 8px">' +
            SWATCHES.map(function (s) {
              return '<button class="sw" type="button" data-set="' + t.id + '|' + s.id +
                '" aria-pressed="' + (t.sw === s.id) + '" style="background:' +
                (isDark() ? s.d : s.l) + '" aria-label="' + s.id + '"></button>'; }).join('') +
          '</div>';
      }).join('') +
      '<hr class="rule" style="margin:8px 0">' +
      '<div class="field"><label>Add a topic</label>' +
        '<div style="display:flex;gap:8px">' +
          '<input class="input" id="newTopName" placeholder="Study, Fitness, Side project…" maxlength="22">' +
          '<button class="btn primary" id="newTopGo" type="button" style="width:48px;flex:none;padding:0" ' +
            'aria-label="Add topic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
            '<path d="M12 5.5v13M5.5 12h13"/></svg></button></div>' +
        '<div class="swatches" id="newTopSw" style="margin-top:8px">' +
          SWATCHES.map(function (s, i) {
            return '<button class="sw" type="button" data-new="' + s.id + '" aria-pressed="' +
              (i === 6) + '" style="background:' + (isDark() ? s.d : s.l) + '" aria-label="' +
              s.id + '"></button>'; }).join('') + '</div></div>';
    }

    sheet('Topics', body(), function (sh) {
      var chosenSw = SWATCHES[7].id;
      function rewire() { sh.querySelector('.sheet-body').innerHTML = body(); wire(); }
      function wire() {
        sh.querySelectorAll('[data-edit]').forEach(function (b) {
          b.addEventListener('click', function () {
            var pal = sh.querySelector('[data-pal="' + b.dataset.edit + '"]');
            sh.querySelectorAll('[data-pal]').forEach(function (p) {
              if (p !== pal) p.classList.add('hidden'); });
            pal.classList.toggle('hidden');
          });
        });
        sh.querySelectorAll('[data-set]').forEach(function (b) {
          b.addEventListener('click', function () {
            var p = b.dataset.set.split('|');
            topic(p[0]).sw = p[1]; save(); tick(); rewire(); render();
          });
        });
        sh.querySelectorAll('[data-del]').forEach(function (b) {
          b.addEventListener('click', function () {
            var id = b.dataset.del;
            var used = S.library.filter(function (x) { return x.top === id; });
            var fallback = S.topics.filter(function (t) { return t.id !== id; })[0];
            if (used.length && !confirm(used.length + ' task(s) will move to “' +
                fallback.n + '”. Delete this topic?')) return;
            used.forEach(function (x) { x.top = fallback.id; });
            S.topics = S.topics.filter(function (t) { return t.id !== id; });
            S.topDel.push(id);
            if (filterTop === id) filterTop = 'all';
            save(); rewire(); render();
          });
        });
        sh.querySelectorAll('[data-new]').forEach(function (b) {
          b.addEventListener('click', function () {
            chosenSw = b.dataset.new;
            sh.querySelectorAll('[data-new]').forEach(function (x) {
              x.setAttribute('aria-pressed', String(x.dataset.new === chosenSw)); });
          });
        });
        var nameIn = sh.querySelector('#newTopName');
        function addTopic() {
          var v = nameIn.value.trim(); if (!v) return;
          S.topics.push({ id: 'u' + nid(), n: v, sw: chosenSw });
          save(); tick(); rewire(); render();
        }
        nameIn.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); addTopic(); } });
        sh.querySelector('#newTopGo').addEventListener('click', addTopic);
      }
      wire();
    });
  }

  /* ── Task editor: name, topic, and when it repeats ──────
     This is the answer to "a task that only happens on Tuesdays": set it once
     and the day picks it up every Tuesday from then on. */
  function openTask(id, isNew) {
    var t = lib(id);
    if (!t) return;
    var draft = { t: t.t, top: t.top, rep: JSON.parse(JSON.stringify(t.rep || { k: 'none' })) };

    sheet(isNew ? 'When does it repeat?' : 'Edit task',
      '<div class="field"><label>Task</label>' +
        '<input class="input" id="eName" maxlength="70" value="' + esc(t.t) + '"></div>' +
      '<div class="field"><label>Topic</label><div class="pickrow" id="eTop">' +
        S.topics.map(function (tp) {
          return '<button class="pick" type="button" data-t="' + tp.id + '" aria-pressed="' +
            (tp.id === draft.top) + '"><i style="background:' + topColor(tp.id) + '"></i>' +
            esc(tp.n) + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><label>Repeats</label><div class="pickrow" id="eKind">' +
        [['none','Never'],['daily','Every day'],['week','Certain days'],['month','Once a month']]
          .map(function (k) {
            return '<button class="pick" type="button" data-k="' + k[0] + '" aria-pressed="' +
              (draft.rep.k === k[0]) + '">' + k[1] + '</button>'; }).join('') + '</div></div>' +
      '<div id="eDetail"></div>' +
      '<p class="tiny" id="eSummary"></p>' +
      '<div style="position:sticky;bottom:0;background:var(--ground);padding-top:10px;' +
        'display:flex;flex-direction:column;gap:6px">' +
        '<button class="btn primary" id="eSave" type="button">Save</button>' +
        (isNew ? '' : '<button class="link" id="eDel" type="button">Delete this task</button>') +
      '</div>',

      function (sh, close) {
        var detail = sh.querySelector('#eDetail'), summary = sh.querySelector('#eSummary');

        function paintDetail() {
          if (draft.rep.k === 'week') {
            if (!draft.rep.d) draft.rep.d = [];
            detail.innerHTML = '<div class="pickrow" id="eDays" style="gap:5px">' +
              WD.map(function (n, i) {
                return '<button class="pick" type="button" data-d="' + i + '" aria-pressed="' +
                  (draft.rep.d.indexOf(i) > -1) + '" style="flex:1;justify-content:center;' +
                  'padding:9px 0">' + n + '</button>'; }).join('') + '</div>';
            detail.querySelectorAll('[data-d]').forEach(function (b) {
              b.addEventListener('click', function () {
                var i = Number(b.dataset.d), at = draft.rep.d.indexOf(i);
                if (at > -1) draft.rep.d.splice(at, 1); else draft.rep.d.push(i);
                b.setAttribute('aria-pressed', String(draft.rep.d.indexOf(i) > -1));
                tick(8); paintSummary();
              });
            });
          } else if (draft.rep.k === 'month') {
            if (!draft.rep.d) draft.rep.d = Math.min(parseDay(todayKey()).getDate(), 28);
            var opts = '';
            for (var n2 = 1; n2 <= 31; n2++) {
              opts += '<option value="' + n2 + '"' + (n2 === draft.rep.d ? ' selected' : '') +
                '>' + ordinal(n2) + '</option>';
            }
            detail.innerHTML = '<div class="field"><label>Day of the month</label>' +
              '<select class="input" id="eDom">' + opts + '</select></div>';
            detail.querySelector('#eDom').addEventListener('change', function (e) {
              draft.rep.d = Number(e.target.value); paintSummary(); });
          } else {
            detail.innerHTML = '';
          }
          paintSummary();
        }

        function paintSummary() {
          if (draft.rep.k === 'none') {
            summary.textContent = 'Stays on your list until you choose it for a day.';
          } else if (draft.rep.k === 'week' && !(draft.rep.d || []).length) {
            summary.textContent = 'Pick at least one day.';
          } else {
            summary.innerHTML = 'Added to your day automatically · <b>' +
              esc(repLabel(draft.rep)) + '</b>';
          }
        }

        sh.querySelectorAll('#eTop .pick').forEach(function (b) {
          b.addEventListener('click', function () {
            draft.top = b.dataset.t; tick();
            sh.querySelectorAll('#eTop .pick').forEach(function (x) {
              x.setAttribute('aria-pressed', String(x.dataset.t === draft.top)); });
          });
        });
        sh.querySelectorAll('#eKind .pick').forEach(function (b) {
          b.addEventListener('click', function () {
            draft.rep = { k: b.dataset.k };
            tick();
            sh.querySelectorAll('#eKind .pick').forEach(function (x) {
              x.setAttribute('aria-pressed', String(x.dataset.k === draft.rep.k)); });
            paintDetail();
          });
        });
        paintDetail();

        sh.querySelector('#eSave').addEventListener('click', function () {
          var name = sh.querySelector('#eName').value.trim();
          if (name) t.t = name;
          t.top = draft.top;
          t.rep = draft.rep;
          if (t.rep.k === 'week' && !(t.rep.d || []).length) t.rep = { k: 'none' };
          // If it now falls on today, put it straight in the day.
          if (dueOn(t, S.day.key) && S.day.tasks.indexOf(t.id) < 0) S.day.tasks.push(t.id);
          save(); close(); tick(12);
          setTimeout(render, 60);
        });
        var del = sh.querySelector('#eDel');
        if (del) del.addEventListener('click', function () {
          var ix = S.library.indexOf(t);
          S.library.splice(ix, 1);
          S.libDel.push(t.id);
          S.day.tasks = S.day.tasks.filter(function (x) { return x !== t.id; });
          save(); close(); setTimeout(render, 60);
          setTimeout(function () {
            toast('Deleted “' + t.t + '”', function () {
              S.library.splice(ix, 0, t);
              S.libDel = S.libDel.filter(function (x) { return x !== t.id; });
              save(); render(); });
          }, 300);
        });
      });
  }

  /* ── Pick tasks for today ────────────────────────────── */

    sheet('Add to today',

          '<div style="display:flex;flex-direction:column;gap:7px">' + avail.map(function (t) {
            return '<button class="selrow" type="button" data-id="' + t.id + '" aria-pressed="false">' +
              '<span class="selbox"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.6 4.6L19 7"/></svg></span>' +
              '<span class="dot" style="--topic:' + topColor(t.top) + '"></span>' +
              '<span style="flex:1;min-width:0"><span style="display:block;font-size:.93rem">' +
              esc(t.t) + '</span><span class="row-sub">' + esc(topic(t.top).n) + '</span></span></button>';
          }).join('') + '</div>'
        : '<div class="empty"><h3>Everything is already on today</h3>' +
          '<p class="small">Add more in the Tasks tab.</p></div>') +

        '<button class="btn primary" id="go" type="button" disabled>Add to today</button></div>',

        sh.querySelectorAll('.selrow').forEach(function (b) {
          b.addEventListener('click', function () {
