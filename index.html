<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the app fills the screen under the notch and the
     home indicator once it is added to the Home Screen. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dump everything in. Do one thing.">
<title>One Thing</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<!-- The status bar above the app. One tag, not one per OS scheme: the app
     has its own light/dark switch, and a pair of media-query tags cannot
     answer for it when the two disagree. The value here is the light ground
     for the first paint, and paintThemeColor() in app.js keeps it equal to
     whatever --ground actually resolves to from then on. -->
<meta name="theme-color" id="themeColor" content="#faf7f2">

<!-- Both spellings: the first is the standard, the second is what older iOS
     still reads. Without one of them iOS opens the app in browser chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="One Thing">

<!-- Nunito is the whole typographic idea: round, heavy, friendly at 800. It
     ships with the app (see fonts/) rather than coming from Google, so it is
     there on the first offline launch and nobody outside is told you opened
     the app. Preloaded because text can't paint until it arrives. -->
<link rel="preload" href="./fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin>

<style>
  html,body{height:100%}
  body{margin:0;background:#fff}
  @media (prefers-color-scheme:dark){body{background:#131f24}}
  [hidden],.hidden{display:none!important}
</style>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">
  <header class="appbar">
    <div class="logo">One&nbsp;Thing</div>
    <div class="bar">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3.5a8.5 8.5 0 108.5 8.5A6.6 6.6 0 0112 3.5z"/></svg>
      </button>
      <button class="avatar" id="profileBtn" type="button" aria-label="You and your stats"></button>
    </div>
  </header>

  <div class="acctbanner hidden" id="acctBanner"></div>

  <main id="main"></main>

  <button class="fab hidden" id="fab" type="button" aria-label="Add to today">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tabbtn" data-tab="today" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.7V12l3 1.9"/></svg>Today</button>
    <button class="tabbtn" data-tab="tasks" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11"/><path d="M3.5 6.3l1.3 1.3L7.2 5M3.5 11.8l1.3 1.3L7.2 10.5M3.5 17.3l1.3 1.3L7.2 16"/></svg>Tasks</button>
    <button class="tabbtn" data-tab="history" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5v5l3.5 2"/><path d="M4.5 9A7.5 7.5 0 1112 19.5"/><path d="M3.2 5.5L4.4 9l3.6-1"/></svg>History</button>
  </nav>
</div>

<!-- config first (sync reads it), then sync (app checks for it), then app. -->
<script src="./config.js"></script>
<script src="./sync.js"></script>
<script src="./app.js"></script>
<script>
  /* Registered with a relative path so this works from a repo subfolder on
     GitHub Pages (username.github.io/one-thing/) as well as from a domain root. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Service worker did not register:', err);
      });
    });
  }
</script>
</body>
</html>
